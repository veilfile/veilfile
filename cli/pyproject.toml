[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license = "MIT"` needs 77+
build-backend = "setuptools.build_meta"

[project]
name = "veilfile"
version = "0.4.0"
description = "Command-line client for Veilfile — private, ephemeral artifact hosting for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Veilfile" }]
keywords = ["veilfile", "artifacts", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
veilfile = "veilfile:main"

[project.urls]
Homepage = "https://veilfile.com"
Documentation = "https://veilfile.com/docs/api/"
Repository = "https://github.com/veilfile/veilfile"

[tool.setuptools]
py-modules = ["veilfile"]
