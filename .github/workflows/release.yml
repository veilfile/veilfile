# Publishes the CLIs with trusted publishing (OIDC): no npm or PyPI token is
# stored anywhere. npmjs.com and pypi.org each trust this file
# (veilfile/veilfile, release.yml) for package `veilfile`.
#
# Release: bump the version (npm: package.json + VERSION in veilfile.js;
# PyPI: pyproject.toml + __version__), merge to main with CI green, then
# push a tag from that commit:
#   git tag npm-v0.4.0 && git push origin npm-v0.4.0
#   git tag pypi-v0.4.0 && git push origin pypi-v0.4.0
# A tag that does not match the package version, or points at a commit that
# is not on main, fails before publishing.
#
# Jobs that can publish hold id-token: write, so every action is pinned to a
# full commit SHA (version in the comment) and every tool to an exact
# version. Bump them deliberately.
name: Release

on:
  push:
    tags: ["npm-v*", "pypi-v*"]

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main (reviewed, CI green)
        # fetch-depth: 0 above already fetched every branch, origin/main included.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main"; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.21.0 (trusted publishing needs 11.5.1+)
        run: npm install -g npm@11.21.0 && npm --version
      - name: Tag matches package.json
        working-directory: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "npm-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
      - name: Publish (prepublishOnly runs the tests; zero dependencies)
        working-directory: npm
        run: npm publish --access public

  # Build and test without publish rights; the publish job only uploads the
  # files this job produced.
  pypi-build:
    if: startsWith(github.ref_name, 'pypi-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main (reviewed, CI green)
        # fetch-depth: 0 above already fetched every branch, origin/main included.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main"; exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches pyproject.toml
        working-directory: cli
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "pypi-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1
          fi
      - name: Test
        working-directory: cli
        run: python -m unittest discover -s tests -t .
      - name: Build and check
        working-directory: cli
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pypi-dist
          path: cli/dist/
          if-no-files-found: error

  pypi-publish:
    needs: pypi-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
