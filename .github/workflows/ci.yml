  site-dashboard:
    name: site-dashboard
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.site != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_PORT: "8808"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-tests/package-lock.json
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            site-tests/requirements.txt
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(sed -n 's/^playwright==//p' site-tests/requirements.txt)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browsers
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # WebKit as well as Chromium: the times (Date and Intl) and the Sign out button in the phone's sheet are checked in the engine of every browser on an iPhone, and a check that skips
      # itself where WebKit is missing would pass in CI by not running (pages.tests_site_parts holds the install).
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r site-tests/requirements.txt
          python -m playwright install --with-deps chromium webkit
          npm ci --prefix site-tests
      # The fixture script makes the dashboard's users with their keys, files, connected apps and billing states, and their sessions. It refuses a server with a Stripe variable.
      - name: Start the app
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-site-not-a-secret
          DATABASE_URL: ""  # always a throwaway SQLite file: migrate must never reach a real database
          SITE_SESSION_FILE: ../site-tests/session.txt
        run: |
          if curl -fsS "http://127.0.0.1:$SITE_PORT/healthz" >/dev/null 2>&1; then
            echo "Something already answers on port $SITE_PORT (a server that an earlier run left behind?). Stop it and run this job again." >&2
            exit 1
          fi
          python manage.py migrate --noinput
          python manage.py shell -c "exec(open('../site-tests/make_staff_session.py').read())"
          python manage.py shell -c "exec(open('../site-tests/make_dashboard_fixtures.py').read())"
          nohup python manage.py runserver "127.0.0.1:$SITE_PORT" --noreload > ../site-tests/server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do curl -fsS "http://127.0.0.1:$SITE_PORT/healthz" >/dev/null && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$SITE_PORT/healthz" >/dev/null || { cat ../site-tests/server.log; exit 1; }
      # The dashboard's sections with the pages part's checks of a page, their changes in place, Sign out, a new key, a revoke, rows that stack and times in the visitor's zone. Chromium, and WebKit
      # for the two checks that depend on the engine. The cloth is stubbed out.
      - name: Browser checks, the dashboard
        run: python -u site-tests/run_site_checks.py --part dashboard --base-url http://127.0.0.1:$SITE_PORT --session-file site-tests/session.txt --out site-tests/artifacts
      - name: Keep the screenshots and the server log
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: site-dashboard-screenshots
          path: |
            site-tests/artifacts/
            site-tests/server.log
          retention-days: 14
      - name: Stop the app
        if: always()
        run: |
          [ -n "${SERVER_PID:-}" ] || exit 0
          kill "$SERVER_PID" 2>/dev/null || exit 0
          for attempt in $(seq 1 10); do kill -0 "$SERVER_PID" 2>/dev/null || exit 0; sleep 1; done
          kill -9 "$SERVER_PID" 2>/dev/null || true
